<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Platform</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .dashboard { max-width: 800px; margin: auto; }
        .box { border: 1px solid #ccc; padding: 15px; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="dashboard">
        <h1>My Trading Platform</h1>
        <div class="box">
            <p>Account Balance: <span id="balance">Loading...</span></p>
        </div>
    </div>
    <script>
        const app_id = 1089;
const ws = new WebSocket(`wss://ws.binaryws.com/websockets/v3?app_id=${app_id}`);

ws.onmessage = async (msg) => {
    const data = JSON.parse(msg.data);
    if (data.msg_type === 'authorize') {
        ws.send(JSON.stringify({ balance: 1 }));
    } else if (data.msg_type === 'balance') {
        document.getElementById('balance').innerText = `${data.balance.balance} ${data.balance.currency}`;
    }
};

ws.onopen = () => {
    ws.send(JSON.stringify({ authorize: 'pat_c7415051aec4a079bf8faaa4037ca6bc91b45e9fddd6b1f760307e31dbdb445b' }));
};
    </script>
</body>
</html>
